name: unimart

services:
  backend:
    build:
      context: .
    init: true
    environment:
      DJANGO_SETTINGS_MODULE: config.docker_settings
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/data
      - backend_media:/media
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/categories/', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  frontend:
    build:
      context: ../frontend
      args:
        # Next.js serializes rewrites during its build, not at container startup.
        BACKEND_URL: http://backend:8000
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['/', '/api/categories/'].map(path => fetch('http://127.0.0.1:3000' + path, {signal: AbortSignal.timeout(4000)}).then(r => {if (!r.ok) throw new Error(String(r.status))}))).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  backend_data:
  backend_media:
